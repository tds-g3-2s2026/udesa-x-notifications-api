apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-api
  namespace: tds-group-3
spec:
  # One pod serves the API and consumes the queue. Two during a rollout is
  # safe: every handler is idempotent by event id.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: notifications-api
  template:
    metadata:
      labels:
        app: notifications-api
    spec:
      containers:
        - name: notifications-api
          # CI must replace ECR_IMAGE with the assigned ECR URI and immutable digest.
          image: '${ECR_IMAGE}'
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: notifications-api-config
            - secretRef:
                name: notifications-api-secret
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # 503 while MongoDB or RabbitMQ is down: the pod leaves the Service
          # without being restarted, and comes back once both answer.
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
