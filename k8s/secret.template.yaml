# Copy to secret.yaml and fill locally, or populate from GitHub Secrets in CI.
# Never apply this empty template to the cluster.
apiVersion: v1
kind: Secret
metadata:
  name: notifications-api-secret
  namespace: tds-group-3
type: Opaque
stringData:
  # DocumentDB: tls with the RDS CA the image carries, users authenticated
  # against admin. Full shape in the README, "Despliegue".
  MONGODB_URL: ''
  # The same broker and user as users-api and posts-api (ADR-019).
  RABBITMQ_URL: ''
  # The public half of the pair users-api signs with, the same posts-api has.
  JWT_PUBLIC_KEY: ''
  RESEND_API_KEY: ''
  # The Firebase key file, whole, as the console downloads it.
  FIREBASE_SERVICE_ACCOUNT: ''
  OTEL_EXPORTER_OTLP_HEADERS: ''
