name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    uses: tds-g3-2s2026/udesa-x-platform/.github/workflows/ci-node.yml@main
    secrets: inherit
    with:
      # ARQUITECTURA.md turns the gate on for the backend services in S3. Below
      # the minimum the PR goes red and cannot be merged.
      bloquear-por-cobertura: true
      # The suite and the production image run against real MongoDB and
      # RabbitMQ, and /healthcheck answers 200 only with both up.
      mongodb-y-rabbitmq: true
      verificar-imagen: true
      puerto-imagen: 8000
      ruta-verificacion: /healthcheck
